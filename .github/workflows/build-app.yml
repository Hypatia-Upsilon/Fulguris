name: Build Custom Fulguris

on:
  workflow_dispatch:
    inputs:
      target_brand:
        description: '选择品牌'
        required: true
        type: choice
        options:
          - slions
          - styx
        default: 'slions'
      target_publisher:
        description: '选择发布渠道 (fdroid 版不含谷歌服务，playstore/download 含)'
        required: true
        type: choice
        options:
          - fdroid
          - undef
          - playstore
          - download
        default: 'fdroid'
      target_abi:
        description: '选择架构'
        required: true
        type: choice
        options:
          - arm64-v8a
          - all
          - armeabi-v7a
        default: 'arm64-v8a'
      release_type:
        description: '是否发布到 GitHub Releases'
        required: true
        type: choice
        options:
          - none
          - pre-release
          - release
        default: 'none'
      custom_app_id:
        description: '自定义包名(可选)'
        required: false
        type: string
        default: 'SlionsFullPlaystore.alpha'

jobs:
  build:
    name: Build Fulguris
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 3. Inject Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > app/release.keystore

      - name: 4. Dynamic Modification (Groovy Version)
        run: |
          # A. 注入签名配置块 (Groovy 语法)
          # 在 android { 后面插入 signingConfigs
          sed -i '/android {/a \
              signingConfigs {\
                  release {\
                      storeFile file("release.keystore")\
                      storePassword System.getenv("KEYSTORE_PASSWORD")\
                      keyAlias System.getenv("KEY_ALIAS")\
                      keyPassword System.getenv("KEY_PASSWORD")\
                  }\
              }' app/build.gradle

          # B. 强制 Release 使用该签名 (替换原有的注释行)
          sed -i 's/\/\/signingConfig debug.signingConfig/signingConfig signingConfigs.release/g' app/build.gradle

          # C. 架构过滤处理
          TARGET_ABI="${{ github.event.inputs.target_abi }}"
          if [ "$TARGET_ABI" != "all" ]; then
            echo "🔥 锁定单架构: $TARGET_ABI"
            # 在 release 块的 ndk 部分注入 abiFilters
            sed -i "/ndk {/a \                abiFilters \"$TARGET_ABI\"" app/build.gradle
          fi

          # D. 自定义包名处理 (修改 Brand 层的 applicationId)
          CUSTOM_ID="${{ github.event.inputs.custom_app_id }}"
          if [ -n "$CUSTOM_ID" ]; then
             BRAND="${{ github.event.inputs.target_brand }}"
             echo "🔥 修改品牌 $BRAND 的基础包名为: $CUSTOM_ID"
             # 仅修改对应 productFlavor 块内的 applicationId
             sed -i "/$BRAND {/,/}/ s/applicationId \".*\"/applicationId \"$CUSTOM_ID\"/" app/build.gradle
          fi

      - name: 5. Verify Build Script
        run: |
          echo "=== 核心配置校验 ==="
          grep -A 10 "signingConfigs" app/build.gradle
          grep -A 5 "release {" app/build.gradle
          grep -A 10 "productFlavors" app/build.gradle

      - name: 6. Run Build Task
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # 组合 Task 名称，例如: assembleSlionsFullFdroidRelease
          # 注意：VERSION 维度默认固定使用 full
          BRAND="${{ github.event.inputs.target_brand }}"
          PUBLISHER="${{ github.event.inputs.target_publisher }}"
          # 转换首字母大写
          BRAND_CAP="$(echo ${BRAND:0:1} | tr '[:lower:]' '[:upper:]')${BRAND:1}"
          PUBLISHER_CAP="$(echo ${PUBLISHER:0:1} | tr '[:lower:]' '[:upper:]')${PUBLISHER:1}"
          
          TASK="assemble${BRAND_CAP}Full${PUBLISHER_CAP}Release"
          echo "🚀 执行任务: $TASK"
          chmod +x gradlew
          ./gradlew $TASK

      - name: 7. Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Fulguris-${{ github.event.inputs.target_brand }}-${{ github.event.inputs.target_publisher }}
          path: app/build/outputs/apk/**/*.apk

      - name: 8. Create Release
        if: ${{ github.event.inputs.release_type != 'none' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ github.run_number }}"
          name: "Fulguris Custom Build ${{ github.run_number }}"
          prerelease: ${{ github.event.inputs.release_type == 'pre-release' }}
          files: app/build/outputs/apk/**/*.apk

      - name: 9. Security Cleanup
        if: always()
        run: |
          [ -f app/release.keystore ] && shred -u app/release.keystore
          git checkout app/build.gradle 2>/dev/null || true
